# ============================================================
#  需求雷达 · 识别词典
#  痛点句式库(pain) + 需求领域词典(domains) + 变现映射
#  weights: 单个信号的强度，0-4，越大越说明"这是真需求且可能付费"
# ============================================================

thresholds:
  min_topic_items: 2      # 少于这么多条证据的主题不进入主榜（先当待验证）
  min_item_score: 12      # 单条素材低于此分不参与聚簇

# ---------- 0. 通用词（不能单独当作需求主题，只能当辅助关键词） ----------
# 这些词太泛，单靠它们无法定位市场，仅用于聚簇时的辅助匹配
generic_primary:
  - 工具
  - 软件
  - 模板
  - 插件
  - 脚本
  - 自动化
  - api
  - 接口
  - 对接
  - 网关
  - 文档
  - sdk
  - webhook
  - 大模型
  - ai
  - gpt
  - prompt
  - 提示词
  - agent
  - workflow
  - 工作流
  - 定时任务
  - 数据库
  - sql
  - 数据分析
  - 报表
  - 看板
  - bi
  - 部署
  - 服务器
  - 运维
  - 监控
  - 日志
  - docker
  - k8s
  - 写作
  - ai写作
  - 素材
  - 私域
  - 社群
  - 客服
  - 数据
  - 效率
  - 兼职

# ---------- 1. 痛点 / 需求信号句式 ----------
# w = 权重；tag = 信号类别；re = 正则（不区分大小写）
pain_patterns:
  # ===== 明确"求开发 / 求方案" —— 最强的需求信号 =====
  - {re: '谁(能|来|会)(做|开发|写)一?[个款套]', w: 3.5, tag: 求开发}
  - {re: '(要|如果|要是|要是能)有(这么)?一?[个款]?[就多]好', w: 3.2, tag: 求开发}
  - {re: '为(什么|啥)(没|不)有', w: 2.6, tag: 供给缺失}
  - {re: '(求|跪求|急求|(?<!\d)想要|想?找个|需要一个?)(一?[个款套])?(工具|软件|app|应用|网站|插件|脚本|模板|平台|服务|方案)', w: 3.4, tag: 求方案}
  - {re: '(有没有|有无|求|推荐)(一?[个款])?(好用|免费|靠谱|好用的)?(的)?(工具|软件|app|应用|网站|插件|脚本|模板|平台)', w: 3.2, tag: 求方案}
  - {re: '求(推荐|安利|指点|教|带)', w: 2.4, tag: 求方案}
  - {re: 'i wish (there was|there were|i could|someone would)', w: 3.5, tag: 求开发}
  - {re: 'someone should (build|make|create)', w: 3.5, tag: 求开发}
  - {re: "why (isn't|is there no|doesn't) there", w: 2.6, tag: 供给缺失}
  - {re: '(is|are) there (a|any|an) (tool|app|service|way|library|platform)', w: 3.0, tag: 求方案}
  - {re: '(looking for|need|recommend)( me)? a (tool|app|service|way to)', w: 3.0, tag: 求方案}
  - {re: 'how (do|can) (i|you|we) (automate|track|manage|monetize|scrape|convert)', w: 2.4, tag: 自动化需求}

  # ===== 付费意愿 —— 直接决定能不能赚钱 =====
  - {re: '(愿意|可以|能|接受)(付费|花钱|付钱|买|订阅)', w: 4.0, tag: 付费意愿}
  - {re: '(付费|花钱)(也|都)?(行|可以|没问题|无所谓)', w: 4.0, tag: 付费意愿}
  - {re: '(求|有没有)(付费|收费|会员|专业)版', w: 3.2, tag: 付费意愿}
  - {re: '(多少钱|价格(是)?多少|怎么收?费)', w: 2.6, tag: 价格询问}
  - {re: '(willing|happy|glad) to pay', w: 4.0, tag: 付费意愿}
  - {re: 'would pay (for|\$|money)', w: 4.0, tag: 付费意愿}
  - {re: 'shut up and take my money', w: 4.0, tag: 付费意愿}
  - {re: '(budget|\$\d+\s*(\/|per )?(mo|month|year))', w: 3.0, tag: 预算明确}
  - {re: '(taobao|alibaba|1688|pdd|dropship).{0,20}(arbitrage|resell|margin)', w: 2.2, tag: 生意意图}

  # ===== 低效 / 手动劳动 —— 自动化产品的主战场 =====
  - {re: '(太|很|好|超)(麻烦|费劲|费事|繁琐|累|崩溃)', w: 3.0, tag: 低效}
  - {re: '(费|浪费|耗)(时间|精力|人力|半天|一天)', w: 2.8, tag: 低效}
  - {re: '效率(太|很)?(低|差|慢)', w: 2.8, tag: 低效}
  - {re: '(只能|还在|都是|得)(手动|人工|一个个|一条条|一张张|手搓)', w: 3.0, tag: 手动劳动}
  - {re: '(copy|paste|retype|re-?enter|by hand|manually|spreadsheet).{0,30}(every|each|daily|day|week|hour)', w: 2.9, tag: 手动劳动}
  - {re: '(tedious|painful|frustrating|annoying|waste of time)', w: 2.6, tag: 低效}
  - {re: '\b(batch|bulk|automat\w*|one-?click|scripts?)\b', w: 1.8, tag: 自动化需求}
  - {re: '(批量|一键|自动化|脚本|定时|批处理)', w: 1.9, tag: 自动化需求}

  # ===== 现有供给的缺陷 —— 替代/改进机会 =====
  - {re: '(太贵|好贵|贵了|贵死|贵得|有点贵|很贵|挺贵|贵太多|买贵|太坑|好坑|坑爹|坑死|被坑|大坑|价格(?:太|偏)高)', w: 2.2, tag: 价格痛点}
  - {re: '(买不起|付不起|负担不起|用不起)', w: 2.6, tag: 价格痛点}
  - {re: '(平替|替代品?|替代方案|换一个|开源版)', w: 2.8, tag: 替代需求}
  - {re: '(alternative to|cheaper than|open[- ]source alternative)', w: 2.8, tag: 替代需求}
  - {re: '(不会用|太难用|不好用|难用|反人类|设计得?智障|体验差)', w: 2.7, tag: 体验差}
  - {re: '(找不到|搜不到|没找到|没有找到|查不到)', w: 2.7, tag: 供给缺失}
  - {re: "(no good|nothing (works|out there)|can't find any)", w: 2.6, tag: 供给缺失}
  - {re: '(闪退|崩溃|打不开|用不了|不能用|出错|漏数据|丢数据|\bbug\b)', w: 1.4, tag: 缺陷}
  - {re: '(广告太多|广告烦|收费才能用|不充钱)', w: 2.3, tag: 变现方式惹人烦}

  # ===== 迁移 / 集成 / 数据流动需求 =====
  - {re: '(?:导入|导出|同步|备份|迁移|对接|互通|打通)(?:的)?(?:数据|excel|表格|微信|手机|系统|平台|账号|文件|到)|(?:怎么|如何|想要|需要|自动|批量|无法|不能|很难)(?:导入|导出|同步|备份|迁移|对接)', w: 1.6, tag: 数据流转}
  - {re: '(integrat|sync|export|import|migrat|connect).{0,20}(api|tool|app|service)', w: 1.5, tag: 数据流转}

  # ===== 赚钱 / 生意意图 —— 用户自己想赚钱，愿意买"赚钱工具" =====
  - {re: '(副业|兼职|搞钱|赚钱|变现|接单|私活|睡后收入|被动收入)', w: 2.2, tag: 赚钱意图}
  - {re: '(选品|爆款|起号|涨粉|引流|获客|私域|转化率|\broi\b)', w: 2.3, tag: 生意术语}
  - {re: '(side ?hustle|passive income|monetiz|make money)', w: 2.2, tag: 赚钱意图}

  # ===== 学习 / 求助 —— 教学类产品需求 =====
  - {re: '(怎么学|如何学|小白|零基础|教教我|求教程|有没有教程|入门(?!款|级|机|版|套装))', w: 2.0, tag: 教学需求}
  - {re: '(学不会|看不懂|太难学|搞不懂|不明白)', w: 1.9, tag: 教学需求}

  # ===== 紧迫性 —— 加权因子 =====
  - {re: '(急用|急求|着急|很急|比较急|特别急|在线等|马上要|今天就要|紧急|\bdeadline\b|\basap\b|\burgent\b)', w: 1.5, tag: 紧迫}

# ---------- 2. 需求领域词典 ----------
# k      = 命中关键词（含别名，全小写匹配）
# cat    = 领域分类
# money  = 变现路径建议（会出现在需求卡片里）
# mat    = 成熟度：0 蓝海 / 1 有竞争 / 2 红海（越低越值得做）
domains:

  # ---- 个人财务 ----
  - {k: [记账, 记账app, 记账软件, 记帐, 记流水, 账单管理, 番茄记账], cat: 财务效率, mat: 2, money: "订阅 ¥12-29/月；表格模板包 ¥9.9-29"}
  - {k: [报销, 报销单, 发票, 发票整理, 发票查验, 差旅报销, 费用报销], cat: 财务效率, mat: 1, money: "企业版按人年费 ¥99-299；代整理服务 ¥5/张起"}
  - {k: [对账, 银行流水, 流水整理, 流水导出, 支付宝账单, 微信账单], cat: 财务效率, mat: 1, money: "按次 ¥9.9-49；批量导出工具 ¥199 终身"}
  - {k: [报税, 个税, 汇算清缴, 税务申报, 开票, 开票软件], cat: 财务效率, mat: 2, money: "SaaS ¥299-999/年；代申报服务 ¥200-800/次"}
  - {k: [工资, 排班, 考勤, 打卡, 算薪, 请假], cat: 人力行政, mat: 2, money: "小微企业 SaaS ¥5-15/人/月；排班表模板 ¥19.9"}
  - {k: [进销存, 库存, 库存管理, 出入库, 台账, 门店管理, 收银], cat: 商家效率, mat: 2, money: "SaaS ¥299-1999/年；定制开发 ¥3000+，这是小微企业刚需"}

  # ---- 职场 / 求职 ----
