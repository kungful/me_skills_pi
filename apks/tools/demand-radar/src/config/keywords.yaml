# ---------- 4. 需求验证清单（每条高分需求自动附上） ----------
validation_playbook:
  - "① 反向搜索：把需求原话丢进百度/必应/小红书/闲鱼，看是否已有人在做、价格多少"
  - "② 付费测试：做一页落地页 + 收款码（或预售），48 小时内看是否有 3 个人真的付钱"
  - "③ 人工MVP：自己先人工服务 3 个客户（收全价），验证需求真实存在再写代码"
  - "④ 渠道测试：同一卖点分别在 小红书/闲鱼/公众号 各发 1 帖，24h 看私信量"
  - "⑤ 定价测试：同一产品挂 3 档价格（¥19.9/¥99/¥299），看哪档转化最好"
