<!doctype html><html><head><meta charset="utf-8"><title>e2e</title>
<style>body{font:13px monospace}iframe{width:390px;height:900px;border:0}</style></head>
<body>
<iframe id="f"></iframe>
<pre id="out"></pre>
<!-- 端到端交互测试：用无头 Chrome 打开本文件，读 <pre id="out"> 即可 -->
<script>
const R = [];
const ok = (c, m) => R.push((c ? 'PASS  ' : 'FAIL  ') + m);
const f = document.getElementById('f');
f.src = 'index.html';
const wait = ms => new Promise(r => setTimeout(r, ms));
let done = false;

f.onload = async () => {
  if (done) return; done = true;
  await wait(400);
  const d = f.contentDocument, w = f.contentWindow;
  const click = s => { const e = d.querySelector(s); if (!e) throw new Error('找不到 ' + s); e.click(); };
  const val = s => d.querySelector(s).value;
  const txt = s => d.querySelector(s).textContent;

  try {
    /* ---------- 三角页 ---------- */
    click('#tabs [data-t="tri"]');
    await wait(120);
    ok(!!d.querySelector('#triSvg svg'), '三角页画出 SVG');
    ok(txt('#triSvg').indexOf('对边 a=3') >= 0, '默认以 A 角看：a 是对边');
    ok(txt('#triSvg').indexOf('邻边 b=4') >= 0, '默认以 A 角看：b 是邻边');
    ok(txt('#triSvg').indexOf('斜边 c=5') >= 0, '斜边 c=5');

    click('#triRef [data-r="B"]');
    await wait(120);
    ok(txt('#triSvg').indexOf('邻边 a=3') >= 0, '切 B 角：a 变邻边');
    ok(txt('#triSvg').indexOf('对边 b=4') >= 0, '切 B 角：b 变对边');
    ok(txt('#triSvg').indexOf('斜边 c=5') >= 0, '切 B 角：斜边不变');
    click('#triRef [data-r="A"]');
    await wait(120);

    click('#triHot [data-k="sin"]');
    await wait(120);
    ok(d.querySelector('#triSvg').innerHTML.indexOf('hot') > 0, '点 sin → 图上两条边高亮');
    ok(d.querySelector('#triSvg').innerHTML.indexOf('dim') > 0, '点 sin → 另外那条边变暗');
    click('#triHot [data-k="sin"]');

    click('#triModes [data-m="Ac"]');
    await wait(120);
    const ins = d.querySelectorAll('#triInputs input');
    ok(ins.length === 2, '锐角+斜边：两个输入框（实为 ' + ins.length + '）');
    ok(ins[0].dataset.k === 'A' && ins[1].dataset.k === 'c', '锐角+斜边字段是 A 和 c');
    ins[0].value = '30'; ins[0].dispatchEvent(new w.Event('input', { bubbles: true }));
    ins[1].value = '10'; ins[1].dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait; await wait(80);
    ok(txt('#triSvg').indexOf('对边 a=5') >= 0, '30°/斜边10 → 对边 a=5（实为 ' + (txt('#triSvg').match(/对边 a=[\d.]+/) || ['无'])[0] + '）');
    ok(txt('#triSvg').indexOf('邻边 b=8.66') >= 0, '30°/斜边10 → 邻边 b=8.66');
    ok(txt('#triBig').indexOf('8.66') >= 0, '结果卡同步');

    click('#triModes [data-m="ab"]');
    await wait(120);
    const ab = d.querySelectorAll('#triInputs input');
    ab[0].value = '5'; ab[0].dispatchEvent(new w.Event('input', { bubbles: true }));
    ab[1].value = '12'; ab[1].dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(80);
    ok(txt('#triSvg').indexOf('斜边 c=13') >= 0, '5-12-13 勾股');
    ab[1].value = '1'; ab[1].dispatchEvent(new w.Event('input', { bubbles: true }));
    ab[0].value = '1'; ab[0].dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(80);
    ok(txt('#triSteps').indexOf('45') >= 0, '两边相等 → 45°');

    /* ---------- 比值页 ---------- */
    click('#tabs [data-t="ratio"]');
    await wait(150);
    ok(txt('#rTheta') === '30°', '默认 30°');
    const range = d.querySelector('#rRange');
    range.value = '45'; range.dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(120);
    ok(txt('#rTheta') === '45°', '拖动滑块 → 45°');
    ok(d.querySelector('#rCards').textContent.indexOf('0.7071') >= 0, '45° 时 sin=0.7071');
    ok(d.querySelector('.rc[data-k="tan"]').textContent.indexOf('1') >= 0, '45° 时 tan=1');
    d.querySelector('.rc[data-k="tan"]').click();
    await wait(120);
    ok(d.querySelector('.rc[data-k="tan"]').className.indexOf('on') >= 0, '点 tan 卡变选中');
    ok(d.querySelector('#rSvg').innerHTML.indexOf('hot') > 0, 'tan 高亮直角边');
    click('#rQuick [data-a="60"]');
    await wait(120);
    ok(txt('#rTheta') === '60°', '快捷按钮 60°');
    ok(d.querySelector('#rRange').value === '60', '滑块同步到 60');
    /* 反查 */
    const ia = d.querySelector('#rInvA'), ib = d.querySelector('#rInvB');
    ia.value = '3'; ia.dispatchEvent(new w.Event('input', { bubbles: true }));
    ib.value = '5'; ib.dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(120);
    ok(txt('#rInvOut').indexOf('36.87') >= 0, 'arcsin(3/5)=36.87°（实为 ' + txt('#rInvOut').replace(/\s+/g, ' ').slice(0, 60) + '）');
    ia.value = '6'; ia.dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(120);
    ok(txt('#rInvOut').indexOf('不可能大于 1') >= 0, 'sin 比值 >1 会报错');

    /* ---------- 坡度页 ---------- */
    click('#tabs [data-t="slope"]');
    await wait(150);
    ok(d.querySelector('[data-out="slope"]').textContent.indexOf('2.862') >= 0, '坡度默认 2.862°');
    ok(d.querySelector('#cc_slope').textContent.indexOf('4.005') >= 0, '坡度默认斜长 4.005');
    const Lf = d.querySelector('#cc_slope input[data-k="L"]');
    Lf.value = '10'; Lf.dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(80);
    ok(d.querySelector('#cc_slope input[data-k="H"]') !== null, 'LH 模式仍有 H 输入框');
    click('#cc_slope [data-sel="mode"] [data-v="AL"]');
    await wait(120);
    ok(!d.querySelector('#cc_slope input[data-k="H"]'), '切到角度模式后 H 输入框消失');
    ok(!!d.querySelector('#cc_slope input[data-k="A"]'), '角度模式出现 θ 输入框');
    ok(d.querySelector('[data-out="slope"]').textContent.indexOf('30') >= 0, '角度模式用 A=30 计算');

    /* ---------- 力学页：带入截面 ---------- */
    click('#tabs [data-t="mech"]');
    await wait(250);
    const sec = d.querySelector('#cc_section');
    sec.querySelector('[data-sel="type"] [data-v="circle"]').click();
    await wait(120);
    ok(!sec.querySelector('input[data-k="h"]') && !!sec.querySelector('input[data-k="d"]'), '切圆形后字段跟着换');
    sec.querySelector('input[data-k="d"]').value = '300';
    sec.querySelector('input[data-k="d"]').dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(120);
    ok(sec.textContent.indexOf('39760.8') >= 0, '圆 d=300 的 I = 39760.8 cm⁴');
    ok(sec.textContent.indexOf('2650.7') >= 0, '圆 d=300 的 W = πd³/32 = 2650.7 cm³');
    ok(sec.textContent.indexOf('截面直径 d') >= 0, '圆的行标签叫「截面直径 d」');
    ok(sec.textContent.indexOf('π·d³/32') >= 0, '圆给出正确的 W 公式');
    sec.querySelector('[data-sel="type"] [data-v="square"]').click();
    await wait(120);
    ok(!sec.querySelector('input[data-k="b"]') && !sec.querySelector('input[data-k="d"]') && !!sec.querySelector('input[data-k="a"]'), '正方形只留 a');
    ok(sec.textContent.indexOf('a³/6') >= 0, '正方形 W 公式 a³/6');
    sec.querySelector('[data-sel="type"] [data-v="ibeam"]').click();
    await wait(120);
    ok(!!sec.querySelector('input[data-k="tw"]') && !!sec.querySelector('input[data-k="tf"]') && !sec.querySelector('input[data-k="d"]'), 'H 型钢出 tw/tf');
    sec.querySelector('[data-sel="type"] [data-v="circle"]').click();
    await wait(120);
    sec.querySelector('input[data-k="d"]').value = '300';
    sec.querySelector('input[data-k="d"]').dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(120);

    const st = d.querySelector('#cc_stress');
    const wBefore = st.querySelector('input[data-k="W"]').value;
    st.querySelector('[data-act="0"]').click();
    await wait(150);
    const wAfter = st.querySelector('input[data-k="W"]').value;
    ok(wAfter !== wBefore && parseFloat(wAfter) > 0, '「带入截面 W」把 W 填成 ' + wAfter);
    st.querySelector('[data-act="3"]').click();
    await wait(150);
    ok(st.querySelector('input[data-k="f"]').value === '14.3', '「C30」按钮改 f=14.3');
    ok(st.textContent.indexOf('不满足') >= 0, 'C30 + 大弯矩应判不满足');

    const beam = d.querySelector('#cc_beam');
    beam.querySelector('[data-sel="type"] [data-v="cant"]').click();
    await wait(120);
    ok(beam.textContent.indexOf('悬臂梁') >= 0, '切悬臂梁生效');
    beam.querySelector('[data-sel="type"] [data-v="ss"]').click();
    await wait(120);
    ok(beam.textContent.indexOf('简支梁') >= 0, '切回简支梁生效');

    /* ---------- 速查页 ---------- */
    click('#tabs [data-t="ref"]');
    await wait(150);
    ok(txt('#view').indexOf('正弦比对斜') >= 0, '速查有口诀');
    ok(d.querySelectorAll('#view table').length >= 4, '速查有数据表');

    /* ---------- 返回键 ---------- */
    w.__back();
    await wait(150);
    ok(d.querySelector('#tabs .tab.on').dataset.t === 'tri', '返回键回到第一个页签');
  } catch (e) {
    R.push('THROW ' + e.message + '\n' + e.stack);
  }
  const bad = R.filter(x => x.indexOf('PASS') !== 0).length;
  document.title = 'E2E ' + (bad ? 'FAIL' : 'OK') + ' total=' + R.length;
  document.getElementById('out').textContent = R.join('\n');
};
</script>
</body></html>
