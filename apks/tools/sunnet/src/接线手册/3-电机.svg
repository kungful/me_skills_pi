<rect x="540" y="120" width="320" height="30" rx="8" fill="#00695c" stroke="#00695c" stroke-width="1"/>
<rect x="540" y="141" width="320" height="10" rx="0" fill="#00695c" stroke="#00695c" stroke-width="1"/>
