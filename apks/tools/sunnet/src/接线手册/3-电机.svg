<text x="700.0" y="166.45" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="11" fill="#546e7a" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">高电平触发，15A</text>
<circle cx="540" cy="202.5" r="6" fill="#fffde7" stroke="#00695c" stroke-width="2"/>
