<rect x="1360" y="131" width="300" height="10" rx="0" fill="#1a237e" stroke="#1a237e" stroke-width="1"/>
<text x="1510.0" y="130.04" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="14" fill="#ffffff" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}" font-weight="bold">ESP32-S3 开发板</text>
<text x="1510.0" y="156.45" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="11" fill="#546e7a" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">先别插 USB</text>
<circle cx="1360" cy="186.66666666666666" r="6" fill="#fffde7" stroke="#1a237e" stroke-width="2"/>
<text x="1371" y="190.98666666666665" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#263238" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">5V</text>
<circle cx="1360" cy="233.33333333333331" r="6" fill="#fffde7" stroke="#1a237e" stroke-width="2"/>
<text x="1371" y="237.6533333333333" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#263238" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">GND</text>
<polyline points="1260,155 1360,155" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linejoin="round"/>
<rect x="1291.6" y="133.0" width="36.8" height="18.0" rx="4" fill="#ffffff" stroke="#ef6c00" stroke-width="1"/>
<text x="1310" y="146.32" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#ef6c00" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}" font-weight="bold">+5V</text>
<polyline points="1260,235 1330,235 1330,265" fill="none" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
<rect x="980" y="400" width="280" height="140" rx="10" fill="#f5f7fa" stroke="#00695c" stroke-width="2"/>
<rect x="980" y="400" width="280" height="30" rx="8" fill="#00695c" stroke="#00695c" stroke-width="1"/>
<rect x="980" y="421" width="280" height="10" rx="0" fill="#00695c" stroke="#00695c" stroke-width="1"/>
<text x="1120.0" y="420.04" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="14" fill="#ffffff" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}" font-weight="bold">MOS 开关模块</text>
<text x="1120.0" y="446.45" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="11" fill="#546e7a" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">母线电从这里过</text>
<circle cx="980" cy="466.6666666666667" r="6" fill="#fffde7" stroke="#00695c" stroke-width="2"/>
<text x="991" y="470.9866666666667" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#263238" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">VIN+</text>
<circle cx="980" cy="503.3333333333333" r="6" fill="#fffde7" stroke="#00695c" stroke-width="2"/>
<text x="991" y="507.6533333333333" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#263238" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">VIN-</text>
<polyline points="860,170 920,170 920,460 980,460" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round"/>
<polyline points="860,260 960,260 960,500 980,500" fill="none" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
<rect x="50" y="400" width="880" height="135" rx="8" fill="#fff8e1" stroke="#e65100" stroke-width="2"/>
<text x="62" y="422.25" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="15" fill="#e65100" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}" font-weight="bold">※ 上电顺序（一定按这个来）</text>
<text x="62" y="446.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#4e342e" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">① 把 12V 适配器、保险丝、端子排、LM2596 先接好，ESP32 先不插。</text>
<text x="62" y="467.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#4e342e" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">② 万用表直流档：端子排 +12V 排 对 GND 排 应显示 12V 左右（±0.5V）。</text>
<text x="62" y="488.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#4e342e" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">③ 拧 LM2596 上的蓝色电位器，让 OUT+ 对 OUT- 正好 5.0V（4.9~5.1 都行）。</text>
<text x="62" y="509.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#4e342e" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">④ 确认后再把 LM2596 的 OUT+ → ESP32 的 5V，OUT- → ESP32 的 GND。</text>
<text x="62" y="530.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#4e342e" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">⑤ 保险丝必须装在 +12V 这一根上（靠近电源那端），不要装在地线上。</text>
<rect x="50" y="545" width="880" height="114" rx="8" fill="#ffebee" stroke="#b71c1c" stroke-width="2"/>
<text x="62" y="567.25" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="15" fill="#b71c1c" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}" font-weight="bold">常见错误</text>
<text x="62" y="591.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#4e342e" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">· 电源正负极千万别接反：反接会瞬间烧掉模块。接完再量一遍。</text>
<text x="62" y="612.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#4e342e" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">· 12V 适配器电流要 ≥3A（电机启动电流大，1A 的会“打嗝”）。</text>
<text x="62" y="633.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#4e342e" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">· 用 USB 给 ESP32 烧程序时，把 12V 电源关掉。</text>
<text x="62" y="654.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#4e342e" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">· 户外用请换 12V/5A 防水电源（IP67），并加直流防雷器。</text>
<text x="1330" y="343.3" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="14" fill="#37474f" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}" font-weight="bold">线色约定：</text>
<polyline points="1330,368 1385,368" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round"/>
<text x="1396" y="371.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#37474f" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">红 = +12V</text>
<polyline points="1330,402 1385,402" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linejoin="round"/>
<text x="1396" y="405.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#37474f" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">橙 = +5V</text>
<polyline points="1330,436 1385,436" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round"/>
<text x="1396" y="439.825" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="13.5" fill="#37474f" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">黑 = GND</text>
</svg>
