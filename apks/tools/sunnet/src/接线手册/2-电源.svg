<circle cx="1260" cy="180.0" r="6" fill="#fffde7" stroke="#00695c" stroke-width="2"/>
<text x="1249" y="184.32" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#263238" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">OUT+</text>
<circle cx="1260" cy="240.0" r="6" fill="#fffde7" stroke="#00695c" stroke-width="2"/>
<text x="1249" y="244.32" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#263238" text-anchor="{'lt': 'start', 'lm': 'start', 'ct': 'middle', 'cm': 'middle', 'rt': 'end', 'rm': 'end'}">OUT-</text>
<polyline points="860,170 900,170 900,140 980,140" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round"/>
